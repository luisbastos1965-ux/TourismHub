<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turma PRO - Área do Professor</title>
    
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">

    <!-- FullCalendar Biblioteca e Idioma Português -->
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js'></script>
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/locales/pt.global.min.js'></script>
    
    <!-- Biblioteca de Compressão de Imagens no Browser (NOVO) -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.js"></script>
</head>
<body>

    <header class="app-header">
        <div class="logo-container">
            <img src="logo_tur.png" alt="Logótipo Turma PRO" id="logo">
            <h1>Turma PRO</h1>
        </div>
        <div class="user-info">
            <span id="header-user-name-staff">Bem-vindo, Professor</span>
            <button id="btn-logout-staff" class="btn-perigo">Sair</button>
        </div>
    </header>

    <main class="dashboard-container" id="prof-dashboard">
        
        <h2>Painel de Controlo</h2>

        <section class="card">
            <div id="area-eventos">
                <h3>📅 Marcar Novo Teste/Evento</h3>
                <div class="form-group">
                    <label for="nome-evento">Título do Evento:</label>
                    <input type="text" id="nome-evento" placeholder="Ex: Teste de Matemática" class="input-padrao">
                </div>
                
                <div class="form-group">
                    <label for="data-evento">Data:</label>
                    <input type="date" id="data-evento" class="input-padrao">
                </div>
                
                <button id="btn-criar-evento" class="btn-principal">Marcar na Agenda</button>
            </div>
        </section>

        <section class="card">
            <h3>👥 Gestão de Turmas</h3>
            <div class="turmas-grid">
                <div class="turma-card-large" data-turma="10A">
                    <h4>Turma 10ºA</h4>
                    <p>Abrir Hub da Turma</p>
                </div>
            </div>
        </section>

    </main>

    <div id="class-hub-view" style="display: none;">
        <h2 id="class-hub-title">Turma Atual</h2>
        <button id="btn-voltar-turmas-hub">Voltar</button>
        <button id="btn-hub-alunos">Ver Alunos</button>
        <button id="btn-hub-avaliacoes">Avaliações</button>
        <button id="btn-hub-calendario">Calendário</button>
        <button id="btn-hub-sumarios">Sumários</button>
    </div>

    <div id="class-view" style="display: none;">
        <button id="btn-voltar-lista">Voltar</button>
        <div class="students-list-container"></div>
    </div>
    
    <div id="student-detail-view" style="display: none;">
        <button id="btn-voltar-class-hub">Voltar</button>
        <h3 id="detail-student-name"></h3>
        <p id="detail-student-number"></p>
        <button id="btn-hub-faltas">Faltas</button>
        <button id="btn-hub-prhf">PRHF</button>
        <button id="btn-hub-comportamento">Comportamento</button>
        <button id="btn-hub-musai">MUSAI</button>
        <button id="btn-hub-observacoes">Observações de Reunião</button>
    </div>
    
    <div id="view-avaliacoes" style="display: none;">
        <button id="btn-voltar-hub-avaliacoes">Voltar</button>
        <div id="matriz-disciplinas-container"></div>
    </div>
    
    <div id="view-disciplina-modulos" style="display: none;">
        <button id="btn-voltar-disciplinas">Voltar</button>
        <h3 id="titulo-disciplina"></h3>
        <div id="lista-modulos-disciplina"></div>
    </div>
    
    <div id="view-faltas" style="display: none;">
        <button id="btn-voltar-hub-faltas">Voltar</button>
        <div id="lista-historico-faltas-container"></div>
    </div>
    
    <div id="view-prhf" style="display: none;">
        <button id="btn-voltar-hub-prhf">Voltar</button>
        <div id="lista-prhf-container"></div>
    </div>

    <div id="view-class-calendario" style="display: none;">
        <button id="btn-voltar-cal-hub">Voltar</button>
        <div id="calendario-prof" style="margin-top: 15px; background: white; padding: 15px; border-radius: 8px; color: black;">
            <!-- O calendário do professor vai nascer aqui -->
        </div>
    </div>

    <div id="view-sumarios" style="display: none;">
        <button id="btn-voltar-sumarios-hub">Voltar</button>
        <div id="lista-sumarios-container"></div>
    </div>

    <div id="view-comportamento" style="display: none;">
        <button id="btn-voltar-hub-comportamento">Voltar</button>
        <div id="lista-comportamento-container"></div>
    </div>

    <div id="view-musai" style="display: none;">
        <button id="btn-voltar-hub-musai">Voltar</button>
        <h3>🧩 Medidas de Apoio (MUSAI)</h3>
        <div id="lista-musai-container" style="margin-bottom: 20px;"></div>
        
        <div class="card" style="border: 2px dashed var(--primary-color);">
            <h4>Adicionar Informação MUSAI</h4>
            <div class="form-group">
                <textarea id="novo-musai-texto" placeholder="Descreve a medida ou adaptação necessária..." class="input-padrao" rows="3" style="width: 100%;"></textarea>
            </div>
            <button id="btn-gravar-musai" class="btn-principal">Gravar Medida</button>
        </div>
    </div>

    <div id="view-observacoes" style="display: none;">
        <button id="btn-voltar-hub-observacoes">Voltar</button>
        <h3>📑 Observações de Reunião</h3>
        <div id="lista-observacoes-container" style="margin-bottom: 20px;"></div>
        
        <div class="card" style="border: 2px dashed var(--primary-color);">
            <h4>Escrever nova Síntese</h4>
            <div class="form-group">
                <select id="novo-obs-momento" class="input-padrao" style="width: 100%; margin-bottom: 10px;">
                    <option value="Intercalar 1 (Nov)">Intercalar 1 (Nov)</option>
                    <option value="1º Semestre">1º Semestre</option>
                    <option value="Intercalar 2 (Abr)">Intercalar 2 (Abr)</option>
                    <option value="2º Semestre">2º Semestre</option>
                </select>
            </div>
            <div class="form-group">
                <textarea id="novo-obs-texto" placeholder="O aluno revelou empenho e..." class="input-padrao" rows="4" style="width: 100%;"></textarea>
            </div>
            <button id="btn-gravar-obs" class="btn-principal">Publicar Observação</button>
        </div>
    </div>

    <script type="module" src="js/prof-app.js"></script>
</body>
</html>
