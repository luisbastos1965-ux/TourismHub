<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Turma PRO - Família</title>
    <link rel="icon" type="image/png" href="logo_tur.png">
    <link rel="stylesheet" href="style.css?v=5">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="app-content">
        <!-- HEADER -->
        <header id="header-ee" class="app-header">
            <div class="user-profile" style="flex: 1; min-width: 0;">
                <select id="header-ee-student-selector" class="ee-student-selector">
                    <option value="">A carregar alunos...</option>
                </select>
            </div>
            <div style="display: flex; align-items: center; gap: 15px; flex-shrink: 0;">
                <button id="btn-open-notificacoes" class="notification-bell">
                    <i class="fa-solid fa-bell"></i>
                    <span id="badge-notificacoes" class="notification-badge" style="display:none;">0</span>
                </button>
                <button id="btn-logout-ee" class="logout-btn" title="Sair" style="font-size: 1.2rem;"><i class="fa-solid fa-right-from-bracket"></i></button>
            </div>
        </header>

        <main class="app-content" style="padding-bottom: 80px; padding-top: 15px;">
            
            <!-- 1. DASHBOARD PRINCIPAL -->
            <div id="ee-dashboard">
                <div class="ee-summary-grid">
                    <!-- CARTÃO PREMIUM: MÉDIA GLOBAL E COMPONENTES -->
                    <div class="ee-summary-card ee-card-extended">
                        <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                            <div><i class="fa-solid fa-graduation-cap"></i><div class="ee-summary-label">Média Global Atual</div></div>
                            <div class="ee-summary-value" id="resumo-media" style="font-size: 2.2rem; color: var(--primary-green);">...</div>
                        </div>
                        <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; margin-top: 15px; border-top: 1px dashed #444; padding-top: 15px;">
                            <div class="sub-media-box"><span class="sub-media-label">Sócio.</span><span class="sub-media-value" id="resumo-med-socio">-</span></div>
                            <div class="sub-media-box"><span class="sub-media-label">Científica</span><span class="sub-media-value" id="resumo-med-cient">-</span></div>
                            <div class="sub-media-box"><span class="sub-media-label">Técnica</span><span class="sub-media-value" id="resumo-med-tec">-</span></div>
                        </div>
                        <div style="display:flex; justify-content:space-around; margin-top: 15px; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 8px;">
                            <div style="text-align:center;"><span style="font-size:0.8rem; color:var(--text-muted);">FCT:</span> <strong id="resumo-fct" style="color:white;">-</strong></div>
                            <div style="text-align:center;"><span style="font-size:0.8rem; color:var(--text-muted);">PAP:</span> <strong id="resumo-pap" style="color:white;">-</strong></div>
                        </div>
                    </div>

                    <div class="ee-summary-card">
                        <div><i class="fa-solid fa-user-xmark" style="color: var(--danger-red);"></i><div class="ee-summary-value" id="resumo-faltas">...</div></div>
                        <div class="ee-summary-label">Faltas (Semana)</div>
                    </div>
                    <div class="ee-summary-card">
                        <div><i class="fa-regular fa-calendar-check" style="color: var(--warning-yellow);"></i><div class="ee-summary-value" id="resumo-proximo-evento" style="font-size: 0.9rem;">...</div></div>
                        <div class="ee-summary-label">Próximo Evento</div>
                    </div>
                    <div class="ee-summary-card">
                        <div><i class="fa-solid fa-book-medical" style="color: #0099ff;"></i><div class="ee-summary-value" id="resumo-prhfs">...</div></div>
                        <div class="ee-summary-label">PRHFs Ativos</div>
                    </div>
                    <div class="ee-summary-card">
                        <div><i class="fa-solid fa-triangle-exclamation" style="color: #e67e22;"></i><div class="ee-summary-value" id="resumo-ocorrencias">...</div></div>
                        <div class="ee-summary-label">Ocorrências</div>
                    </div>
                </div>

                <div style="display: flex; gap: 10px; margin-top: 25px;">
                    <button class="primary-btn" id="btn-quick-justificar" style="background-color: var(--success-green); flex: 1; padding: 15px 10px;">
                        <i class="fa-solid fa-file-medical"></i><br><span style="font-size:0.8rem; font-weight:normal; margin-top:5px;">Justificar Falta</span>
                    </button>
                    <button class="primary-btn" id="btn-quick-mensagem" style="background-color: var(--warning-yellow); color: black; flex: 1; padding: 15px 10px;">
                        <i class="fa-solid fa-envelope"></i><br><span style="font-size:0.8rem; font-weight:normal; margin-top:5px;">Falar com DT</span>
                    </button>
                </div>
            </div>

            <!-- 2. CADERNETA E LINHA TEMPORAL -->
            <div id="view-ee-caderneta" style="display: none;">
                <div class="falta-tabs" style="display:flex; flex-wrap:wrap; gap:5px; justify-content:center; margin-bottom: 15px;">
                    <button class="falta-tab-btn active" id="tab-ee-timeline" style="flex: 1 1 100%; border-color: var(--primary-green); color: var(--primary-green);"><i class="fa-solid fa-clock-rotate-left"></i> Linha Temporal</button>
                    <button class="falta-tab-btn" id="tab-ee-notas" style="flex: 1 1 45%;">Notas</button>
                    <button class="falta-tab-btn" id="tab-ee-faltas" style="flex: 1 1 45%;">Faltas</button>
                    <button class="falta-tab-btn" id="tab-ee-prhfs" style="flex: 1 1 45%;">PRHFs</button>
                    <button class="falta-tab-btn" id="tab-ee-comportamento" style="flex: 1 1 45%;">Comportamento</button>
                </div>
                
                <div id="filtro-caderneta-container" style="display:none; margin-bottom: 15px;">
                    <select id="filtro-caderneta-disc" style="margin:0; background-color: var(--bg-dark); border-radius: 8px;">
                        <option value="">Todas as Disciplinas</option>
                    </select>
                </div>

                <div id="ee-caderneta-content"></div>
            </div>

            <!-- 3. AGENDA (LISTA) -->
            <div id="view-ee-agenda" style="display: none;">
                <div class="agenda-filters">
                    <label class="agenda-filter-label"><input type="checkbox" id="filtro-agenda-testes" checked> <span style="color:#ffaa00;">●</span> Testes/Av.</label>
                    <label class="agenda-filter-label"><input type="checkbox" id="filtro-agenda-trabalhos" checked> <span style="color:#00d2ff;">●</span> Entregas</label>
                    <label class="agenda-filter-label"><input type="checkbox" id="filtro-agenda-outros" checked> <span style="color:#b82bf2;">●</span> Outros</label>
                </div>
                <div id="ee-agenda-content"></div>
            </div>

            <!-- 4. HORÁRIO -->
            <div id="view-ee-horario" style="display: none;">
                <div class="week-nav-bar">
                    <button id="btn-ee-prev-week"><i class="fa-solid fa-chevron-left"></i></button>
                    <span id="ee-week-display">A carregar...</span>
                    <button id="btn-ee-next-week"><i class="fa-solid fa-chevron-right"></i></button>
                </div>
                <div id="ee-horario-content" style="margin-top:15px;"></div>
            </div>

            <!-- 5. CHAT COM O DT -->
            <div id="view-ee-chat" style="display: none; flex-direction: column; height: 75vh;">
                <div class="class-header" style="margin-bottom: 10px;">
                    <button id="btn-voltar-chat-ee" class="secondary-btn small-btn" style="border: none; background: rgba(255,255,255,0.1); width: auto;"><i class="fa-solid fa-arrow-left"></i> Voltar</button>
                </div>
                <div class="forum-messages" id="ee-chat-messages-container" style="flex:1; overflow-y:auto; padding:15px; display:flex; flex-direction:column; gap:15px; background: var(--bg-card); border-radius: 12px 12px 0 0; border: 1px solid #333; border-bottom: none;"></div>
                <div class="forum-input-area" style="background:#1a1a1a; padding:10px; border: 1px solid #333; display:flex; gap:8px; align-items:center; border-radius: 0 0 12px 12px;">
                    <input type="text" id="ee-input-chat-msg" placeholder="A sua mensagem..." style="margin:0; flex:1; border-radius:20px; padding:10px 15px;">
                    <button id="btn-ee-send-msg" class="forum-send-btn" style="width:40px; height:40px; background-color: var(--warning-yellow); color: black;"><i class="fa-solid fa-paper-plane"></i></button>
                </div>
            </div>

            <!-- 6. JUSTIFICAR FALTAS -->
            <div id="view-ee-justificar" style="display: none;">
                <div class="class-header" style="margin-bottom: 15px;">
                    <button id="btn-voltar-justificar" class="secondary-btn small-btn" style="border: none; background: rgba(255,255,255,0.1); width: auto;"><i class="fa-solid fa-arrow-left"></i> Voltar</button>
                </div>
                <div class="card" style="margin-bottom: 20px;">
                    <h3 style="margin-bottom: 15px; font-size: 1rem;"><i class="fa-solid fa-cloud-arrow-up"></i> Enviar Comprovativo</h3>
                    <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 15px;">Tire foto do atestado para justificar ausências.</p>
                    <div style="background:var(--bg-dark); padding:20px; border-radius:8px; border:1px dashed #555; text-align:center; margin-bottom:15px;">
                        <label for="ee-upload-atestado" class="secondary-btn" style="margin:0 auto; width:fit-content; border-color: var(--success-green); color: var(--success-green); cursor: pointer;">
                            <i class="fa-solid fa-camera"></i> Anexar Foto / PDF
                        </label>
                        <input type="file" id="ee-upload-atestado" style="display:none;" accept="image/*,.pdf">
                        <span id="ee-atestado-file-name" class="file-name-display" style="display:block; margin-top:10px; font-size:0.85rem; color:white;"></span>
                    </div>
                    <textarea id="ee-atestado-obs" class="input-field" placeholder="Observações (ex: Doença 2ª e 3ª feira)..." style="min-height: 80px; margin-bottom: 15px;"></textarea>
                    <button id="btn-ee-enviar-atestado" class="primary-btn" style="width:100%; background-color: var(--success-green); display:none;"><i class="fa-solid fa-paper-plane"></i> Enviar Atestado</button>
                </div>
                <h3 style="color: var(--primary-green); font-size: 1rem; margin-bottom: 15px;">Histórico de Envios</h3>
                <div id="ee-lista-atestados-container"></div>
            </div>

            <!-- 7. CENTRAL DE NOTIFICAÇÕES -->
            <div id="view-ee-notificacoes" style="display: none;">
                <div class="class-header" style="margin-bottom: 15px;">
                    <button id="btn-voltar-notificacoes" class="secondary-btn small-btn" style="border: none; background: rgba(255,255,255,0.1); width: auto;"><i class="fa-solid fa-arrow-left"></i> Voltar</button>
                </div>
                <h2 style="font-size: 1.2rem; margin-bottom: 15px; color: white;"><i class="fa-solid fa-bell"></i> Central de Alertas</h2>
                <div id="ee-notificacoes-container"></div>
            </div>
        </main>

        <nav class="bottom-nav">
            <a href="#" class="nav-item active" data-target="ee-dashboard"><i class="fa-solid fa-house"></i><span>Início</span></a>
            <a href="#" class="nav-item" data-target="view-ee-caderneta"><i class="fa-solid fa-book-open"></i><span>Caderneta</span></a>
            <a href="#" class="nav-item" data-target="view-ee-agenda"><i class="fa-regular fa-calendar-check"></i><span>Agenda</span></a>
            <a href="#" class="nav-item" data-target="view-ee-horario"><i class="fa-solid fa-clock"></i><span>Horário</span></a>
        </nav>
    </div>

    <!-- VACINA DO CACHE -->
    <script type="module" src="./js/ee-app.js?v=5"></script>
</body>
</html>
