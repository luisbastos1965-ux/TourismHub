<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Turma PRO - Login</title>
    <link rel="icon" type="image/png" href="logo_tur.png">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Estilos exclusivos do ecrã de Login para ficar centrado e bonito */
        body { justify-content: center; align-items: center; background: linear-gradient(135deg, var(--bg-dark) 0%, #1a1a1a 100%); }
        .login-box { box-shadow: 0 10px 30px rgba(0,0,0,0.5); border-top: 4px solid var(--primary-green); }
    </style>
</head>
<body>
    <div class="login-box">
        <div style="font-size: 3rem; color: var(--primary-green); margin-bottom: 10px;">
            <i class="fa-solid fa-graduation-cap"></i>
        </div>
        <h2>Turma PRO</h2>
        <p class="text-muted" style="margin-bottom: 20px; font-size: 0.9rem;">Plataforma de Gestão Escolar</p>
        
        <div class="input-group">
            <input type="text" id="login-username" placeholder="Nº de Utilizador (ex: a1234)">
            <input type="password" id="login-password" placeholder="Palavra-passe">
        </div>
        
        <p id="login-error" class="error-msg" style="display: none;">Credenciais inválidas.</p>
        
        <button id="btn-login-manual" class="primary-btn">
            <i class="fa-solid fa-right-to-bracket"></i> Entrar
        </button>
    </div>

    <!-- O Script que trata do Login está modularizado -->
    <script type="module" src="./js/auth.js"></script>
</body>
</html>
