<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>App Turma</title>
    <link rel="icon" type="image/png" href="logo_tur.png">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- ECRÃ DE LOGIN -->
    <div id="login-screen" class="login-container">
        <div class="login-box">
            <h2><i class="fa-solid fa-graduation-cap"></i> Turma PRO</h2>
            
            <div class="input-group">
                <input type="text" id="login-username" placeholder="Nº de Aluno (ex: a1234)">
                <input type="password" id="login-password" placeholder="Palavra-passe">
            </div>
            
            <p id="login-error" class="error-msg" style="display: none;">Credenciais inválidas.</p>
            
            <button id="btn-login-manual" class="primary-btn">Entrar</button>
        </div>
    </div>

    <!-- A APLICAÇÃO (Escondida por defeito) -->
    <div id="app-content" style="display: none;">
        <!-- Top Header -->
        <header class="app-header">
            <div class="logo"><i class="fa-solid fa-graduation-cap"></i> Turma PRO</div>
            <div class="user-profile">
                <span>A carregar...</span>
                <button id="btn-logout" class="logout-btn"><i class="fa-solid fa-right-from-bracket"></i> Sair</button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="app-content">
            
            <!-- CAIXA 1: Painel do Aluno -->
            <div id="student-dashboard" style="display: none;">
                <section class="card warning-card">
                    <h3><i class="fa-solid fa-bullhorn"></i> Aviso da Direção</h3>
                    <p>Reunião de Pais agendada para a próxima sexta-feira às 18h30.</p>
                </section>
                <section class="section-container">
                    <h2 class="section-title">A tua área ficará disponível em breve.</h2>
                </section>
            </div>

            <!-- CAIXA 2: Painel de Administração -->
            <div id="admin-dashboard" style="display: none;">
                <h2 class="section-title"><i class="fa-solid fa-users-gear"></i> As Minhas Turmas</h2>
                
                <div class="turmas-grid">
                    <button class="turma-card" data-turma="10T">
                        <i class="fa-solid fa-users"></i>
                        <span>10T</span>
                    </button>
                    
                    <button class="turma-card" data-turma="11T">
                        <i class="fa-solid fa-users"></i>
                        <span>11T</span>
                    </button>
                    
                    <button class="turma-card" data-turma="12T">
                        <i class="fa-solid fa-users"></i>
                        <span>12T</span>
                    </button>
                </div>
            </div>

            <!-- CAIXA 3: Vista da Turma -->
            <div id="class-view" style="display: none;">
                <div class="class-header">
                    <button id="btn-voltar-turmas" class="secondary-btn small-btn">
                        <i class="fa-solid fa-arrow-left"></i> Voltar
                    </button>
                    <h2 id="class-title" class="section-title">Turma X</h2>
                </div>
                
                <div class="students-list-container">
                    <p style="color: var(--text-muted);">A carregar lista de alunos...</p>
                </div>
            </div>

        </main>
        
        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <a href="#" class="nav-item active"><i class="fa-solid fa-house"></i><span>Início</span></a>
            <a href="#" class="nav-item"><i class="fa-solid fa-chart-pie"></i><span>Avaliações</span></a>
            <a href="#" class="nav-item"><i class="fa-solid fa-user-clock"></i><span>Faltas</span></a>
            <a href="#" class="nav-item"><i class="fa-solid fa-briefcase"></i><span>FCT/PAP</span></a>
        </nav>
    </div>

    <!-- Importar o nosso JavaScript -->
    <script type="module" src="app.js"></script>
</body>
</html>
