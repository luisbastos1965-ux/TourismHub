<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Turma PRO - Login</title>
    <link rel="icon" type="image/png" href="logo_tur.png">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { justify-content: center; align-items: center; background: linear-gradient(135deg, var(--bg-dark) 0%, #1a1a1a 100%); min-height: 100vh; display: flex; margin: 0; transition: background 0.4s ease; }
        [data-theme="light"] body { background: linear-gradient(135deg, var(--bg-dark) 0%, #e5e7eb 100%); }
        
        .login-box { 
            background: var(--bg-card); padding: 40px 30px; border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); border-top: 4px solid var(--primary-green);
            width: 100%; max-width: 350px; text-align: center;
            transition: all 0.4s ease;
        }
        .biometric-btn {
            background-color: transparent; border: 2px solid var(--primary-green); color: var(--primary-green);
            width: 100%; padding: 12px; border-radius: 8px; font-size: 1rem; font-weight: bold;
            cursor: pointer; margin-top: 15px; display: flex; align-items: center; justify-content: center; gap: 10px;
            transition: all 0.3s; display: none;
        }
        .biometric-btn:hover { background-color: rgba(0, 204, 136, 0.1); }
        .biometric-btn i { font-size: 1.4rem; }

        /* Botão Mágico Tema Claro/Escuro */
        .theme-toggle-wrapper { position: fixed; top: 20px; right: 20px; z-index: 1000; }
        .theme-toggle-btn {
            background: var(--bg-card); border: 1px solid #333; color: var(--warning-yellow);
            width: 45px; height: 45px; border-radius: 50%; cursor: pointer; display: flex;
            justify-content: center; align-items: center; font-size: 1.2rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        [data-theme="light"] .theme-toggle-btn { border-color: #d1d5db; color: #8b5cf6; } /* Lua Roxa */
        .theme-toggle-btn:hover { transform: scale(1.1) rotate(15deg); }
        #theme-icon { transition: transform 0.4s ease, opacity 0.3s ease; }
    </style>
</head>
<body>
    <!-- Botão de Tema -->
    <div class="theme-toggle-wrapper">
        <button id="btn-theme-toggle" class="theme-toggle-btn" title="Mudar Tema">
            <i id="theme-icon" class="fa-solid fa-sun"></i>
        </button>
    </div>

    <div class="login-box">
        <div style="font-size: 3.5rem; color: var(--primary-green); margin-bottom: 10px;">
            <i class="fa-solid fa-graduation-cap"></i>
        </div>
        <h2 style="margin-bottom: 25px;">Turma PRO</h2>
        
        <div class="input-group" style="text-align: left;">
            <input type="text" id="login-username" placeholder="Nº Utilizador" style="margin-bottom: 15px;">
            
            <!-- Contentor da Password com o Olho -->
            <div style="position: relative;">
                <input type="password" id="login-password" placeholder="Palavra-passe" style="margin-bottom: 0; padding-right: 40px;">
                <i class="fa-solid fa-eye" id="toggle-password" style="position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: var(--text-muted); cursor: pointer; padding: 5px;"></i>
            </div>
        </div>
        
        <p id="login-error" class="error-msg" style="display: none; margin-top: 15px; margin-bottom: 0; color: var(--danger-red); font-size: 0.85rem; font-weight: bold;"></p>
        
        <button id="btn-login-manual" class="primary-btn" style="width: 100%; margin-top: 20px;">
            <i class="fa-solid fa-right-to-bracket"></i> Entrar
        </button>

        <!-- Botão de Impressão Digital / Face ID -->
        <button id="btn-login-biometrico" class="biometric-btn">
            <i class="fa-solid fa-fingerprint"></i> Entrar com Biometria
        </button>
    </div>

    <script type="module" src="./js/auth.js"></script>
</body>
</html>
